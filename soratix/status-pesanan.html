<!DOCTYPE html>
<html>

<head>

<title>Status Pesanan - SoraTix</title>


<style>

body{

font-family:Georgia,serif;

background:#dff6f7;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}


.card{

background:white;

width:420px;

padding:35px;

border-radius:15px;

text-align:center;

box-shadow:
0 5px 20px rgba(0,0,0,.1);

}


.logo img{

width:80px;

}


h1{

font-size:26px;

}


#status{

margin-top:20px;

padding:15px;

border-radius:10px;

background:#eefafa;

}


button{

margin-top:25px;

background:#a8dfe3;

border:none;

padding:12px 30px;

border-radius:8px;

cursor:pointer;

font-family:inherit;

}


</style>

</head>


<body>


<div class="card">


<div class="logo">

<img src="assets/logo.png">

</div>


<h1>
SoraTix
</h1>


<div id="status">

</div>


<button onclick="home()">

Kembali ke Home

</button>


</div>



<script>


let notif =
JSON.parse(
localStorage.getItem(
"notifCustomer"
));


let box =
document.getElementById(
"status"
);



if(notif){


box.innerHTML = `

<h3>
${notif.judul}
</h3>


<p>
${notif.pesan}
</p>


<small>
${notif.waktu}
</small>

`;


}

else{


box.innerHTML=

`
<p>
Belum ada update pesanan.
</p>
`;

}



function home(){

window.location.href=
"index.html";

}


</script>



</body>

</html>
