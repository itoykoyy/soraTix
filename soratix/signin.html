<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign Up - SoraTix</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body class="login-body">

    <div class="login-card">

        <!-- LOGO -->

        <div class="login-logo">

            <img
                src="assets/logo.png"
                alt="SoraTix">

            <h1>
                SoraTix
            </h1>

        </div>


        <!-- JUDUL -->

        <h2>
            Create Account
        </h2>

        <p class="login-subtitle">
            Buat akun untuk mulai perjalananmu
        </p>


        <!-- FORM -->

        <form onsubmit="signup(event)">

            <div class="input-group">

                <label for="name">
                    Nama Lengkap
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Masukkan nama kamu"
                    required>

            </div>


            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email kamu"
                    required>

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Buat password"
                    required>

            </div>


            <div class="input-group">

                <label for="confirmPassword">
                    Konfirmasi Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Masukkan ulang password"
                    required>

            </div>


            <button
                type="submit"
                class="login-submit">

                Sign Up

            </button>

        </form>


        <!-- LOGIN -->

        <p class="signup-text">

            Sudah punya akun?

            <a href="login.html">
                Login
            </a>

        </p>


        <!-- KEMBALI -->

        <a
            href="index.html"
            class="back-home">

            ← Kembali ke Home

        </a>

    </div>


    <script>

        function signup(event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            /* Cek password */

            if (password !== confirmPassword) {

                alert(
                    "Password dan konfirmasi password tidak sama."
                );

                return;
            }


            /* Simpan akun sementara */

            localStorage.setItem(
                "userName",
                name
            );

            localStorage.setItem(
                "userEmail",
                email
            );

            localStorage.setItem(
                "userPassword",
                password
            );


            alert(
                "Akun berhasil dibuat!"
            );


            /* Balik ke login */

            window.location.href =
                "login.html";

        }

    </script>

</body>

</html>
